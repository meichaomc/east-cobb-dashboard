name: Network check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          probe() { echo "--- $1"; curl -sS -o /dev/null -m 40 -w 'http=%{http_code} time=%{time_total} ip=%{remote_ip}\n' -A "east-cobb-dashboard/1.0 (personal research script)" "$1" 2>&1 || true; }
          probe "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10&cosd=2026-09-01"
          probe "https://fred.stlouisfed.org/data/DGS10.txt"
          probe "https://fred.stlouisfed.org/"
          probe "https://api.stlouisfed.org/fred/series?series_id=DGS10&file_type=json"
          probe "https://www.stlouisfed.org/"
