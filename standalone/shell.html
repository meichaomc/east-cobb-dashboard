<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>East Cobb 房市看板</title>
<style>
  :root {
    color-scheme: light dark;
    --font-anthropic-sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-anthropic-serif: Georgia, "Songti SC", "SimSun", serif;
    --cds-font-size-caption: .75rem;
    --cds-font-size-body: .875rem;
    --cds-font-size-heading: 1.0625rem;
    --cds-font-size-title: 1.375rem;
    --cds-font-weight-medium: 500;
    --cds-gap-xs: .5rem;
    --cds-gap-sm: .75rem;
    --cds-gap-md: 1rem;
    --cds-gap-xl: 2rem;
    --cds-pad-xs: .375rem;
    --cds-pad-sm: .5rem;
    --cds-pad-md: .75rem;
    --cds-pad-lg: 1rem;
    --cds-radius: .5rem;
    --cds-dur-slow: .45s;
    --color-bg: #fcfcfb;
    --color-fg: #0b0b0b;
    --color-fg-muted: #52514e;
    --color-border-line: rgb(11 11 11 / .12);
    --color-panel: #ffffff;
    --color-ok: #008300;
    --color-warn: #b87800;
    --color-bad: #c9302c;
    --cds-text-secondary: #52514e;
    --cds-surface-popover: #ffffff;
    --cds-shadow-popover: 0 8px 24px #0000001f, 0 2px 6px #00000014;
    --cds-border: rgb(11 11 11 / .12);
    --cds-chart-grid: rgb(11 11 11 / .08);
    --cds-chart-axis: #52514e;
    --cds-chart-reference: #8c8b86;
    --cds-chart-status-critical: #e34948;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #1a1a19;
      --color-fg: #f0efec;
      --color-fg-muted: #c3c2b7;
      --color-border-line: rgb(255 255 255 / .14);
      --color-panel: #232322;
      --color-ok: #4cb84c;
      --color-warn: #e0a526;
      --color-bad: #e66767;
      --cds-text-secondary: #c3c2b7;
      --cds-surface-popover: #303030;
      --cds-shadow-popover: 0 8px 24px #00000052, 0 2px 6px #0003;
      --cds-border: rgb(255 255 255 / .14);
      --cds-chart-grid: rgb(255 255 255 / .09);
      --cds-chart-axis: #c3c2b7;
      --cds-chart-reference: #8c8b86;
      --cds-chart-status-critical: #e66767;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    }
  }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--color-bg); color: var(--color-fg); }
  .sa-page { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; box-sizing: border-box; }
  .sa-stamp { margin: 32px 0 0; padding-top: 12px; border-top: 1px solid var(--color-border-line); color: var(--color-fg-muted); font: 12px/1.6 var(--font-anthropic-sans); }
  .dash-skeleton { opacity: .4; }
  [hidden] { display: none !important; }
</style>
<script>window.DASH_DATA = /*__DATA__*/;</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>/*__RUNTIME__*/</script>
</head>
<body>
<main class="sa-page">
<!--__PAGE__-->
<p class="sa-stamp">数据更新于 <span id="sa-run-at"></span><span id="sa-failed"></span>。数据来自 FRED、Realtor.com、Zillow、Indeed 和克利夫兰联储，版权归各来源所有，仅供个人参考。</p>
</main>
<script>
  (() => {
    const {run_at, failed} = window.DASH_DATA;
    document.getElementById('sa-run-at').textContent = new Date(run_at).toLocaleString('zh-CN', {timeZone: 'America/New_York'}) + '（美东）';
    const ids = Object.keys(failed || {});
    if (ids.length) document.getElementById('sa-failed').textContent = `；这些数据本次更新失败，显示的是上次的结果：${ids.join('、')}`;
  })();
</script>
</body>
</html>
